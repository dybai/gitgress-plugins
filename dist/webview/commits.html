<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}}"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>Commits</title>
  </head>
  <body>
    <main>
      <div id="scan-progress" class="scan-progress hidden" aria-hidden="true"></div>
      <div id="status" class="status" role="status">Loading commits…</div>
      <section id="content" class="content hidden" aria-label="Commit history">
        <header class="branch-header">
          <button id="repo-name" class="repo-name" type="button" hidden aria-label="Select repository">
            <svg class="header-codicon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12.5 12a.5.5 0 0 0 .5-.5V3a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2v.5a.5.5 0 0 0 .854.354l.646-.646.646.646A.5.5 0 0 0 8 15.5V15h4.5a.5.5 0 0 0 0-1H8v-.5a.5.5 0 0 0-.5-.5h-2a.5.5 0 0 0-.5.5v.5a1 1 0 0 1-1-1v-1h8.5ZM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v8H4V3Z"
              />
            </svg>
            <span id="repo-label"></span>
          </button>
          <button id="branch-switch" class="branch-switch" type="button" aria-label="Switch branch">
            <svg class="header-codicon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M14 5.5C14 4.121 12.879 3 11.5 3A2.502 2.502 0 0 0 9 5.5c0 1.182.826 2.169 1.93 2.428A1.497 1.497 0 0 1 9.5 9h-3c-.565 0-1.081.195-1.5.512V4.949C6.14 4.717 7 3.707 7 2.5 7 1.121 5.879 0 4.5 0A2.502 2.502 0 0 0 2 2.5c0 1.208.86 2.217 2 2.449v6.101c-1.14.232-2 1.242-2 2.449 0 1.379 1.121 2.5 2.5 2.5s2.5-1.121 2.5-2.5a2.499 2.499 0 0 0-1.93-2.428A1.497 1.497 0 0 1 6.5 9.999h3a2.5 2.5 0 0 0 2.454-2.046A2.5 2.5 0 0 0 14 5.5Zm-11-3C3 1.673 3.673 1 4.5 1S6 1.673 6 2.5 5.327 4 4.5 4 3 3.327 3 2.5Zm3 11c0 .827-.673 1.5-1.5 1.5S3 14.327 3 13.5 3.673 12 4.5 12s1.5.673 1.5 1.5ZM11.5 7c-.827 0-1.5-.673-1.5-1.5S10.673 4 11.5 4s1.5.673 1.5 1.5S12.327 7 11.5 7Z"
              />
            </svg>
            <span id="branch-name"></span>
          </button>
        </header>
        <div id="commit-scroll" class="commit-scroll">
          <ol id="commit-list" class="commit-list"></ol>
        </div>
      </section>
    </main>
    <aside id="hover-card" class="hover-card hidden" role="tooltip"></aside>
    <script src="{{scriptUri}}"></script>
  </body>
</html>
