<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}}"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>Commits</title>
  </head>
  <body>
    <main>
      <div id="status" class="status" role="status">Loading commits…</div>
      <section id="content" class="content hidden" aria-label="Commit history">
        <header class="branch-header">
          <span class="branch-icon" aria-hidden="true"></span>
          <span id="branch-name"></span>
          <button id="switch-branch" class="quiet-button" type="button">Switch</button>
        </header>
        <ol id="commit-list" class="commit-list"></ol>
      </section>
    </main>
    <script src="{{scriptUri}}"></script>
  </body>
</html>
